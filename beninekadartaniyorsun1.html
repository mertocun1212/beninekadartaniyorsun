<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Beni Ne Kadar Tanıyorsun?</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #d4fc79, #96e6a1, #84fab0, #8fd3f4);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      color: #333;
    }
    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
    input, button {
      margin: 5px 0;
      padding: 10px;
      width: 100%;
      box-sizing: border-box;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background: #6c5ce7;
      color: white;
      border: none;
      cursor: pointer;
    }
    .screen {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: none;
    }
    a {
      display: inline-block;
      margin-top: 10px;
      text-align: center;
      padding: 10px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
    .rainbow-text {
      font-weight: bold;
      text-align: center;
      margin-top: 15px;
    }
    .rainbow-text span {
      font-size: 16px;
      display: inline-block;
      animation: rainbow 2s linear infinite;
    }
    @keyframes rainbow {
      0% { color: red; }
      20% { color: orange; }
      40% { color: yellow; }
      60% { color: green; }
      80% { color: blue; }
      100% { color: purple; }
    }
  </style>
</head>
<body>
